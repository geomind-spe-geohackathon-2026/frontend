name: geomind-frontend

services:
  frontend:
    build:
      context: .
    image: geomind-frontend:latest
    container_name: geomind-frontend
    restart: unless-stopped
    networks: [traefik]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.geomind-frontend.rule=Host(`geomind.team`)
      - traefik.http.routers.geomind-frontend.entrypoints=websecure
      - traefik.http.routers.geomind-frontend.tls=true
      - traefik.http.routers.geomind-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.geomind-frontend.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: traefik
